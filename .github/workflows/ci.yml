name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and check plugin
        working-directory: plugins/jev-codex-partner
        run: |
          npm ci
          npm run check

      - name: Check relative links
        run: |
          node --test scripts/check-relative-links.test.mjs
          node scripts/check-relative-links.mjs
